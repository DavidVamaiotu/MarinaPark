<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jurnal activitate Marina Park</title>
    <link rel="icon" href="assets/marina-park-logo.png" type="image/png" />
    <link rel="stylesheet" href="activity.css" />
  </head>
  <body>
    <main class="log-shell">
      <header class="log-header">
        <div>
          <p class="eyebrow">Marina Park</p>
          <h1>Jurnal activitate</h1>
        </div>
        <div class="log-actions">
          <label class="search-box">
            <span>Caută</span>
            <input id="logSearch" type="search" placeholder="Client, sumă, card, șters..." />
          </label>
          <div class="event-filters" aria-label="Filtrează jurnalul">
            <button class="event-filter is-active" type="button" data-event-filter="all" aria-pressed="true">Toate</button>
            <button class="event-filter" type="button" data-event-filter="payment" aria-pressed="false">Plăți</button>
            <button class="event-filter" type="button" data-event-filter="update" aria-pressed="false">Editări</button>
            <button class="event-filter" type="button" data-event-filter="delete" aria-pressed="false">Ștergeri</button>
          </div>
          <button class="filter-button" type="button" id="dailyTotalsFilter" aria-pressed="false">Totaluri</button>
          <button type="button" id="refreshLog">Reîncarcă</button>
          <button type="button" id="exportDatabase">Exportă baza de date</button>
          <button class="danger-button" type="button" id="clearActivityLog">Șterge jurnalul</button>
        </div>
      </header>

      <section class="summary-grid" id="summaryGrid" aria-label="Rezumat activitate"></section>
      <section class="log-feed" id="logFeed" aria-live="polite"></section>
    </main>
    <script src="activity.js"></script>
  </body>
</html>
