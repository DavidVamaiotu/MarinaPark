name: Release Marina Park Desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply tag version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Verify update metadata
        run: npm run verify:release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $assets = Get-ChildItem "dist-electron" -File |
            Where-Object { $_.Extension -in ".exe", ".yml", ".blockmap" }

          if (-not $assets) {
            throw "Nu au fost generate fișiere de release Electron."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets.FullName --clobber
          } else {
            gh release create $tag $assets.FullName --title "Marina Park $version" --notes "Actualizare automată Marina Park $version"
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP "marina-release-verify"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          foreach ($asset in $assets) {
            gh release download $tag --pattern $asset.Name --dir $verifyDir --clobber
            $remotePath = Join-Path $verifyDir $asset.Name
            $localHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash -LiteralPath $remotePath -Algorithm SHA256).Hash
            if ($localHash -ne $remoteHash) {
              throw "Asset-ul public nu corespunde: $($asset.Name)"
            }
          }
