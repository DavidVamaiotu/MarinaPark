name: Release Marina Park Desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        # v4.4.0; no cache input is set, but zizmor flags setup-node
        # conservatively in workflows that publish release artifacts.
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply tag version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Verify update metadata
        run: npm run verify:release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $assets = Get-ChildItem "dist-electron" -File |
            Where-Object { $_.Extension -in ".exe", ".yml", ".blockmap" }

          if (-not $assets) {
            throw "Nu au fost generate fișiere de release Electron."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets.FullName --clobber
          } else {
            $title = "Marina Park $version"
            $notes = "Actualizare automată Marina Park $version"
            gh release create $tag $assets.FullName `
              --title $title --notes $notes
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP "marina-release-verify"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          foreach ($asset in $assets) {
            gh release download $tag --pattern $asset.Name `
              --dir $verifyDir --clobber
            $remotePath = Join-Path $verifyDir $asset.Name
            $localHash = (Get-FileHash -LiteralPath $asset.FullName `
              -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash -LiteralPath $remotePath `
              -Algorithm SHA256).Hash
            if ($localHash -ne $remoteHash) {
              throw "Asset-ul public nu corespunde: $($asset.Name)"
            }
          }
